name: Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pip check
      - name: Run tests
        run: python -m pytest

  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.9
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/minimum.txt
      - name: Install package with minimum dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --constraint constraints/minimum.txt ".[dev]"
          python -m pip check
      - name: Run tests
        run: python -m pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install development and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" build twine
      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Verify wheel installation
        run: |
          python -m pip uninstall --yes cap_anndata
          python -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import cap_anndata"
